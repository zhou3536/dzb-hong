<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC多工件宏程序转换工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            color: #222;
            background-color: #f9f9f9;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        body.is-dragging::before {
            content: '拖拽文件放入';
            position: fixed;
            inset: 20px;
            z-index: 10;
            background-color: #f0fdff;
            border: 1px dashed #004979;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 30px;
            border-radius: 20px;
            font-weight: bold;
        }

        .container {
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-width: 100vw;
            /* min-height: 650px; */
        }

        @media (min-width: 500px) {
            .container {
                width: 500px;
            }
        }

        h2 {
            margin-top: 0;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            font-size: 20px;
            text-align: center;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .form-row label {
            width: 200px;
            /* font-size: 14px;
            font-weight: 600; */
            color: #333;
        }

        .form-row .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 200px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border: 1px solid #588ba8;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            min-width: 16px;
            cursor: pointer;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-left: 240px;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        .actions {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background-color: #2894ff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        button:active {
            transform: scale(0.9);
        }

        button:disabled {
            background-color: #b3d1ff;
            cursor: not-allowed;
        }

        button.download-btn {
            background-color: #28a745;
        }


        button.download-btn:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: #6c757d;
            font-weight: normal;
            /* padding: 6px 12px;
            font-size: 13px; */
            margin-left: auto;
        }

        #statusBox {
            margin-top: 18px;
            padding: 5px 6px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            word-break: break-all;
            background-color: #f2fbff;
            border: 1px solid #d7e8f8;
        }

        #statusBox.fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .error {
            background-color: #fff2f2;
            color: #d93025;
            border: 1px solid #f8d7da;
        }

        .success {
            background-color: #f0f9eb;
            color: #1e7e34;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 520px) {
            .form-row label {
                width: 100%;
                margin-bottom: 4px;
            }

            .hint {
                margin-left: 0;
            }
        }

        #filePreview {
            position: fixed;
            inset: 0;
            background-color: #FFF;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }

        #filePreview.show {
            display: flex;
        }

        #filePreview textarea {
            border: 1px solid #bbb;
            padding: 10px;
            width: 100%;
            display: block;
            flex: 1;
            outline: none;
            resize: none;
            font-size: 16px;
            font-family: SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
        }

        #filePreview button {
            display: inline-block;
            margin: 0 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>多工件宏程序转换工具</h2>

        <!-- 1. 上传原始文件 -->
        <div class="form-row">
            <label for="fileInput">上传NC文件</label>
            <div class="input-wrap">
                <input type="file" id="fileInput">
            </div>
        </div>

        <!-- 输入框1 -->
        <div class="form-row">
            <label for="input1">换刀 - 循环起始标识</label>
            <div class="input-wrap">
                <input type="text" id="input1" value="M06">
            </div>
        </div>
        <div class="form-row">
            <label for="skipPreTool">预选刀智能处理</label>
            <div class="input-wrap">
                <input type="checkbox" id="skipPreTool" checked>
                <span style="font-size:13px;color:#444;">智能跳过备刀</span>
            </div>
        </div>

        <!-- 输入框2 -->
        <div class="form-row">
            <label for="input2">主轴停止 - 循环结束标识</label>
            <div class="input-wrap">
                <input type="text" id="input2" value="M05">
            </div>
        </div>

        <!-- 输入框3 -->
        <div class="form-row">
            <label for="input3">变量插入位置</label>
            <div class="input-wrap">
                <input type="number" id="input3" value="3" min="0">
            </div>
        </div>

        <!-- 输入框4 -->
        <div class="form-row">
            <label for="input4Text">循环内安全回零</label>
            <div class="input-wrap">
                <input type="checkbox" id="input4Check" title="勾选启用">
                <input type="text" id="input4Text" value="G91 G28 Z0" disabled>
            </div>
        </div>

        <!-- 输入框5 -->
        <div class="form-row">
            <label for="input5">原工件坐标系</label>
            <div class="input-wrap">
                <input type="text" id="input5" value="G54">
            </div>
        </div>

        <!-- 输入框6 -->
        <div class="form-row">
            <label for="input6">加工起始坐标系 (#1)</label>
            <div class="input-wrap">
                <input type="number" id="input6" value="54">
            </div>
        </div>

        <!-- 输入框7 -->
        <div class="form-row">
            <label for="input7">加工结束坐标系 (#2)</label>
            <div class="input-wrap">
                <input type="number" id="input7" value="55">
            </div>
        </div>

        <!-- 按钮操作区 -->
        <div class="actions">
            <button type="button" id="reprocessBtn">重新处理</button>
            <button type="button" class="download-btn" id="downloadBtn" disabled>保存文件</button>
            <button type="button" class="secondary" id="demoBtn">查看代码</button>
        </div>

        <!-- 状态与报错提示区 -->
        <div id="statusBox">请选择文件，或拖拽文件进来。</div>
    </div>
    <div id="filePreview">
        <textarea name="" id="fileText"></textarea>
        <div>
            <button id="savefileText">保存</button>
            <button id="closeFilePreview">取消</button>
        </div>
    </div>
    <script>


        const fileInput = document.getElementById('fileInput');
        const input4Check = document.getElementById('input4Check');
        const input4Text = document.getElementById('input4Text');
        const reprocessBtn = document.getElementById('reprocessBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const demoBtn = document.getElementById('demoBtn');
        const statusBox = document.getElementById('statusBox');
        const filePreview = document.getElementById('filePreview');
        const fileText = document.getElementById('fileText');
        const savefileText = document.getElementById('savefileText');
        const closeFilePreview = document.getElementById('closeFilePreview');

        demoBtn.addEventListener('click', () => {
            if (processedOutput) {
                filePreview.classList.add('show');
                fileText.value = processedOutput;
            } else {
                showMessage('没有处理成功的代码', true);
            }
        })
        closeFilePreview.addEventListener('click', () => {
            filePreview.classList.remove('show');
            fileText.value = '';
        })
        savefileText.addEventListener('click', () => {
            triggerDownload(fileText.value, processedDownloadName);
        })

        // 保存当前已读取的原始文件内容与生成结果
        let currentRawContent = '';
        let currentOriginalName = '';
        let processedOutput = '';
        let processedDownloadName = '';

        // 联动复选框与输入框4的启用状态
        input4Check.addEventListener('change', function () {
            input4Text.disabled = !this.checked;
        });

        // 显示提示信息函数
        function showMessage(msg, isError) {
            statusBox.classList.remove('fade-in');
            void statusBox.offsetWidth;

            statusBox.className = isError ? 'error' : 'success';
            statusBox.classList.add('fade-in')
            statusBox.textContent = msg;
        }

        // 正则特殊字符转义
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 核心转换函数（只处理并更新状态，不直接触发下载）
        function processProgram() {
            processedOutput = '';
            processedDownloadName = '';
            downloadBtn.disabled = true;

            if (!currentRawContent) {
                showMessage('请先上传原始程序文件（或点击“载入示例文件”）！', true);
                return;
            }

            const strM06 = document.getElementById('input1').value.trim();
            const strM05 = document.getElementById('input2').value.trim();
            const insertLineNum = parseInt(document.getElementById('input3').value, 10);
            const enableSafeZ = document.getElementById('input4Check').checked;
            const strSafeZ = document.getElementById('input4Text').value.trim();
            const strCoord = document.getElementById('input5').value.trim();
            const valStart = parseInt(document.getElementById('input6').value, 10);
            const valEnd = parseInt(document.getElementById('input7').value, 10);
            const skipPreTool = document.getElementById('skipPreTool').checked;

            // 1. 基础输入非空校验
            if (!strM06 || !strM05 || !strCoord) {
                showMessage('报错：输入框1、输入框2、输入框5 均不能为空！', true);
                return;
            }
            if (isNaN(valStart) || isNaN(valEnd) || valEnd < valStart) {
                showMessage('报错：结束坐标系 (#2) 必须大于或等于起始坐标系 (#1)！', true);
                return;
            }

            // 2. 校验原始程序中是否存在输入框1、2、5的内容
            const missingItems = [];
            if (!currentRawContent.includes(strM06)) {
                missingItems.push('换刀代码 [' + strM06 + ']');
            }
            if (!currentRawContent.includes(strM05)) {
                missingItems.push('主轴停止代码 [' + strM05 + ']');
            }
            if (!currentRawContent.includes(strCoord)) {
                missingItems.push('原坐标代码 [' + strCoord + ']');
            }

            if (missingItems.length > 0) {
                showMessage('在程序中未找到 ' + missingItems.join('、') + '，已终止！', true);
                return;
            }

            // 识别原文件换行符（保持输出与原文件一致）
            const lineBreak = currentRawContent.includes('\r\n') ? '\r\n' : '\n';
            const lines = currentRawContent.split(/\r?\n/);

            // 3. 寻找 M06 至下一个 M05 构成循环段，并统计与替换
            const processedLines = [];
            let inLoop = false;
            let toolCount = 0;
            let coordCount = 0;
            const coordRegex = new RegExp(escapeRegExp(strCoord), 'g');

            for (let i = 0; i < lines.length; i++) {
                let currentLine = lines[i];

                // 若在循环段内，替换当前行中所有的原坐标 (如 G54 -> G#3) 并统计次数
                if (inLoop) {
                    const matches = currentLine.match(coordRegex);
                    if (matches) {
                        coordCount += matches.length;
                        currentLine = currentLine.replace(coordRegex, 'G#3');
                    }
                }

                // 如果当前已经在 M06 循环段内，并且遇到了 M05
                if (inLoop && currentLine.includes(strM05)) {
                    if (enableSafeZ && strSafeZ) {
                        processedLines.push(strSafeZ);
                    }
                    processedLines.push('#3 = #3 + 1');
                    processedLines.push('END 1');
                    inLoop = false;
                }

                // 将当前行推入结果
                processedLines.push(currentLine);

                // 如果当前不在循环段内，且遇到了 M06
                if (!inLoop && currentLine.includes(strM06)) {
                    // 检查之后是否真的存在配对的 M05
                    let hasClosingM05 = false;
                    for (let j = i + 1; j < lines.length; j++) {
                        if (lines[j].includes(strM05)) {
                            hasClosingM05 = true;
                            break;
                        }
                    }

                    if (hasClosingM05) {
                        toolCount++;
                        inLoop = true;

                        // 判断下一行是否为单独的预选刀指令（例如 T02）
                        if (skipPreTool && (i + 1 < lines.length)) {
                            const nextLineTrim = lines[i + 1].trim();
                            if (/^T\d+\s*(\(.*\))?$/i.test(nextLineTrim)) {
                                i++; // 前进一行先把预选刀指令放进去
                                processedLines.push(lines[i]);
                            }
                        }

                        // 插入循环头
                        processedLines.push('#3 = #1');
                        processedLines.push('WHILE [#3 LE #2] DO 1');
                    }
                }
            }

            if (toolCount === 0) {
                showMessage('报错：未能成功匹配从 [' + strM06 + '] 到 [' + strM05 + '] 的有效循环段！', true);
                return;
            }

            if (coordCount === 0) {
                showMessage('报错：在循环段内未找到可替换的原坐标 [' + strCoord + ']！', true);
                return;
            }

            // 4. 在第 N 行（默认第3行）后面插入 #1 和 #2
            const targetIndex = isNaN(insertLineNum) ? 3 : Math.max(0, Math.min(insertLineNum, processedLines.length));
            processedLines.splice(targetIndex, 0, '#1 = ' + valStart, '#2 = ' + valEnd);

            // 5. 计算统计信息并显示
            const workpieceCount = (valEnd - valStart) + 1;
            const summaryText = `找到 ${toolCount} 把刀具，替换 ${coordCount} 个坐标，共加工 ${workpieceCount} 个工件 G${valStart}-G${valEnd}`;
            showMessage(summaryText, false);

            // 6. 保存生成结果与目标下载文件名，启用下载按钮
            const dotIndex = currentOriginalName.lastIndexOf('.');
            if (dotIndex > 0) {
                const baseName = currentOriginalName.substring(0, dotIndex);
                const ext = currentOriginalName.substring(dotIndex);
                processedDownloadName = `${baseName}_X${workpieceCount}${ext}`;
            } else {
                processedDownloadName = `${currentOriginalName}_X${workpieceCount}`;
            }

            processedOutput = processedLines.join(lineBreak);
            // console.log(processedOutput)
            downloadBtn.disabled = false;
        }

        // 浏览器离线文件下载触发器
        function triggerDownload(content, filename) {
            if (!content || !filename) return;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 1. 监听上传文件变化：立即读取并自动处理
        // 获取 body 元素
        const body = document.body;

        // 1. 拖拽进入 body (显示 class)
        body.addEventListener('dragover', function (e) {
            e.preventDefault(); // 必须阻止默认行为，否则无法触发 drop
            if (!body.classList.contains('is-dragging')) {
                body.classList.add('is-dragging');
            }
        });

        // 2. 拖拽离开 body (移除 class)
        body.addEventListener('dragleave', function (e) {
            // 检查是否真正离开了 body (防止子元素干扰)
            if (e.relatedTarget === null) {
                body.classList.remove('is-dragging');
            }
        });

        // 3. 拖拽放置文件
        body.addEventListener('drop', function (e) {
            e.preventDefault(); // 阻止浏览器打开文件
            body.classList.remove('is-dragging'); // 移除 class

            // 获取文件列表
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];

                // 调用你的处理逻辑
                handleFileProcessing(file);
            }
        });

        /**
         * 统一的文件处理函数 (复用你的现有逻辑)
         */
        function handleFileProcessing(file) {
            const reader = new FileReader();

            reader.onload = function (e) {
                currentRawContent = e.target.result;
                currentOriginalName = file.name;

                processProgram();
            };

            reader.onerror = function () {
                showMessage('报错：读取文件失败，请重试！', true);
            };

            reader.readAsText(file);
        }

        // 修改后的原有 input 监听
        fileInput.addEventListener('change', function () {
            const file = fileInput.files[0];
            if (file) {
                handleFileProcessing(file); // 使用封装好的函数
            }
        });

        // 2. 点击“重新处理”按钮：修改参数后重新执行转换
        reprocessBtn.addEventListener('click', function () {
            processProgram();
        });

        // 3. 点击“下载文件”按钮：触发下载逻辑
        downloadBtn.addEventListener('click', function () {
            if (!processedOutput) {
                showMessage('报错：当前没有可下载的有效转换结果，请先处理文件！', true);
                return;
            }
            triggerDownload(processedOutput, processedDownloadName);
        });

        // 4. 点击“载入示例文件”按钮：方便无文件时直接测试
        // demoBtn.addEventListener('click', function () {
        //     fileInput.value = '';
        //     currentRawContent = DEMO_CONTENT;
        //     currentOriginalName = '01.nc';
        //     processProgram();
        // });
    </script>

</body>

</html>
